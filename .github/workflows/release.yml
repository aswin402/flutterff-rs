name: Release Linux Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK3 & WebKit2GTK 4.1 dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Rust nightly toolchain (Edition 2024)
        uses: dtolnay/rust-toolchain@nightly

      - name: Build release binary (-j 1)
        run: cargo build --release -j 1

      - name: Package release archive & SHA256SUMS
        run: |
          cp target/release/flutterff-rs flutterff-rs
          chmod +x flutterff-rs
          tar -czf flutterff-rs-linux-x86_64.tar.gz flutterff-rs README.md LICENSE 2>/dev/null || tar -czf flutterff-rs-linux-x86_64.tar.gz flutterff-rs README.md
          sha256sum flutterff-rs-linux-x86_64.tar.gz flutterff-rs > SHA256SUMS

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            flutterff-rs-linux-x86_64.tar.gz
            flutterff-rs
            SHA256SUMS
          generate_release_notes: true
